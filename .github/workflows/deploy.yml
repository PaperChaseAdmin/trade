name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Create .nojekyll
        run: touch .nojekyll
      - name: Clean source files (Pages build fails with large artifacts)
        run: rm -rf venv __pycache__ .github/workflows bot_runner.py bot_profiles.py generate_pages.py openrouter.py zhipu.py requirements.txt
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: '.'
          enable_jekyll: false
