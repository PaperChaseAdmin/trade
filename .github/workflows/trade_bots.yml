name: Run Trading Bots

on:
  schedule:
    # Every 30 min, Mon–Fri, 13:00–21:00 UTC (covers EDT 9:00am–5:00pm & EST 8:00am–4:00pm)
    # NOTE: GitHub disables scheduled workflows after 60 days of repo inactivity.
    # ANY push to ANY file on the default branch reactivates the schedule.
    # Last reactivation: 2026-06-07 (hermes redesign)
    - cron: '0,30 13-21 * * 1-5'
  workflow_dispatch:

concurrency:
  group: trade-bots
  cancel-in-progress: true

jobs:
  trade:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run trading bots
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
        run: python bot_runner.py

      - name: Regenerate bot detail pages (legacy — root repo serves new design)
        run: python generate_pages.py

      - name: Commit updated data to trade repo
        run: |
          git config user.name  "trading-bots[bot]"
          git config user.email "trading-bots[bot]@users.noreply.github.com"
          git add data/ elon/ warren/ donald/ nancy/ cathie/ ray/ george/ michael/ jamie/ kevin/ tony/ gordon/ jordan/ patrick/ scrooge/ yoda/ jerome/ thanos/ satoshi/ xi/
          git diff --staged --quiet || git commit -m "trade: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git push

      - name: Push bot data to root repo (paperchaseadmin.github.io)
        if: success()
        env:
          ROOT_REPO_TOKEN: ${{ secrets.ROOT_REPO_PAT }}
        run: |
          # Only push DATA files — bot detail pages are served from root repo with new design
          git clone https://x-access-token:${ROOT_REPO_TOKEN}@github.com/PaperChaseAdmin/paperchaseadmin.github.io.git /tmp/root-repo
          cd /tmp/root-repo
          git config user.name "trading-bots[bot]"
          git config user.email "trading-bots[bot]@users.noreply.github.com"

          # Copy bot data files to trading-arena/data/bots/
          mkdir -p trading-arena/data/bots
          if [ -d "/home/runner/work/trade/trade/data/bots" ]; then
            rm -rf trading-arena/data/bots/*
            cp -r /home/runner/work/trade/trade/data/bots/* trading-arena/data/bots/
          fi

          git add trading-arena/data/
          git diff --staged --quiet || {
            git commit -m "bot-data: update $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          }
