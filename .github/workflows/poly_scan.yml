name: Poly Watch Scanner

on:
  schedule:
    - cron: '0 0,4,8,12,16,20 * * *'   # every 4 hours (6x daily)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests -q

      - name: Run Polymarket scanner
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python3 polymarket/scanner.py

      - name: Commit scan results
        run: |
          git config user.name "polywatch[bot]"
          git config user.email "polywatch[bot]@users.noreply.github.com"
          git add data/polymarket/scan_results.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "polymarket: scan $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
