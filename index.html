<script>
const MEDALS=['🥇','🥈','🥉'];
function fmt(v){ return '$'+Math.abs(+v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function signPct(v){ const c=+v>=0?'green':'red'; return `<span class="c-${c}">${+v>=0?'+':''}${(+v).toFixed(2)}%</span>`; }
function signVal(v){ const c=+v>=0?'green':'red'; return `<span class="c-${c}">${+v>=0?'+':'-'}${fmt(Math.abs(+v))}</span>`; }
function ago(ts){ const m=Math.floor((Date.now()-new Date(ts))/60000); return m<1?'just now':m<60?m+'m ago':m<1440?Math.floor(m/60)+'h ago':Math.floor(m/1440)+'d ago'; }

let mainChart = null, riskChart = null, _cdTimer = null;

function startCountdown() {
  clearInterval(_cdTimer);
  const el = document.getElementById('countdown-wrap');
  if (!el) return;
  
  function nextMarketOpen() {
    const now = new Date();
    const day = now.getUTCDay();
    const hour = now.getUTCHours();
    const min = now.getUTCMinutes();
    const next = new Date(now);
    
    if (day === 0 || day === 6 || (day === 5 && hour >= 21)) {
      const daysUntilMonday = day === 0 ? 1 : day === 6 ? 2 : (8 - day);
      next.setDate(next.getDate() + daysUntilMonday);
      next.setUTCHours(13, 30, 0, 0);
    } else if (hour < 13 || (hour === 13 && min < 30)) {
      next.setUTCHours(13, 30, 0, 0);
    } else if (hour >= 21) {
      next.setDate(next.getDate() + 1);
      next.setUTCHours(13, 30, 0, 0);
    } else {
      const nextHalf = Math.ceil((hour * 60 + min) / 30) * 30;
      next.setUTCHours(Math.floor(nextHalf/60), nextHalf%60, 0, 0);
    }
    return next;
  }
  
  const target = nextMarketOpen();
  
  function tick() {
    const diff = target - Date.now();
    if (diff <= 0) { el.innerHTML = '<span class="countdown-lbl" data-i18n="next_review">Next Review</span><span class="countdown-num" data-i18n="checking_now">Checking now...</span>'; __retranslate(); return; }
    const h = Math.floor(diff / 3600000);
    const m = Math.floor((diff % 3600000) / 60000);
    const s = Math.floor((diff % 60000) / 1000);
    
    if (h >= 24) {
      const d = Math.floor(h / 24);
      el.innerHTML = '<span class="countdown-lbl" data-i18n="next_review">Next Review</span><span class="countdown-num">' + d + 'd ' + (h%24) + 'h ' + m + 'm</span>';
    } else if (h >= 1) {
      el.innerHTML = '<span class="countdown-lbl" data-i18n="next_review">Next Review</span><span class="countdown-num">' + h + 'h ' + m + 'm ' + s + 's</span>';
    } else {
      el.innerHTML = '<span class="countdown-lbl" data-i18n="next_review">Next Review</span><span class="countdown-num">' + m + 'm ' + s + 's</span>';
    }
  }
  tick();
  _cdTimer = setInterval(tick, 1000);
}

// ── Dashboard: Market Sentinel Panel ──
function buildMarketSentinelPanel() {
  const el = document.getElementById('panel-sentinel-body');
  fetch('https://paperchase.online/market-sentinel/data/market_data.json?t='+Date.now())
    .then(r=>r.json())
    .then(data=>{
      const idx = (data.stocks||{}).indices || {};
      const sp = idx.sp500||{}; const nq = idx.nasdaq||{};
      const dj = idx.dow||{}; const vx = idx.vix||{};
      
      // Generate simple signals based on index trends
      const signals = [];
      if (sp.change_24h) signals.push({name:'S&P 500', val:+sp.change_24h});
      if (nq.change_24h) signals.push({name:'NASDAQ', val:+nq.change_24h});
      if (dj.change_24h) signals.push({name:'Dow', val:+dj.change_24h});
      
      const upCount = signals.filter(s=>s.val>=0).length;
      const totalSig = signals.length;
      const overallSignal = totalSig > 0 ? (upCount > totalSig/2 ? 'bullish' : upCount < totalSig/2 ? 'bearish' : 'neutral') : 'neutral';
      
      el.innerHTML = `
        <div class="signal-card">
          <div class="signal-label" data-i18n="next_day_signal">Next Session Signal</div>
          <div class="signal-direction ${overallSignal === 'bullish' ? 'up' : overallSignal === 'bearish' ? 'down' : ''}">
            ${overallSignal === 'bullish' ? '▲ Bullish' : overallSignal === 'bearish' ? '▼ Bearish' : '— Neutral'}
          </div>
          <div class="accuracy-stats">
            <div class="accuracy-stat"><span class="accuracy-stat-val">${sp.value||'—'}</span><span class="accuracy-stat-label">S&P 500</span></div>
            <div class="accuracy-stat"><span class="accuracy-stat-val ${nq.change_24h>=0?'c-green':'c-red'}">${nq.change_24h||'—'}%</span><span class="accuracy-stat-label">NASDAQ</span></div>
            <div class="accuracy-stat"><span class="accuracy-stat-val ${dj.change_24h>=0?'c-green':'c-red'}">${dj.change_24h||'—'}%</span><span class="accuracy-stat-label">Dow</span></div>
            <div class="accuracy-stat"><span class="accuracy-stat-val">${vx.value||'—'}</span><span class="accuracy-stat-label">VIX</span></div>
          </div>
        </div>
        <div class="signal-card" style="margin-top:10px">
          <div class="signal-label" data-i18n="prediction_history">Signal Accuracy</div>
          <div class="accuracy-stats" style="margin:10px 0 4px">
            <div class="accuracy-stat"><span class="accuracy-stat-val">${totalSig>0?upCount+'/'+totalSig:'—'}</span><span class="accuracy-stat-label" data-i18n="positive_signals">positive today</span></div>
            <div class="accuracy-stat"><span class="accuracy-stat-val">${vx.value<25?'Low':'Normal'}</span><span class="accuracy-stat-label">VIX</span></div>
          </div>
        </div>`;
      __retranslate();
    })
    .catch(()=>{
      el.innerHTML = '<div class="panel-error" data-i18n="error_loading">⚠ Unable to load market data</div>';
      __retranslate();
    });
}

// ── Dashboard: Polymarket Hot Deals Panel ──
function buildPolymarketPanel() {
  const el = document.getElementById('panel-polymarket-body');
  fetch('./data/polymarket/scan_results.json?t='+Date.now())
    .then(r=>r.json())
    .then(data=>{
      const markets = data.markets || data || [];
      // Filter: recommended deals, sorted by volume_24h
      const deals = markets
        .filter(m=>m.heuristic && m.heuristic.recommend)
        .sort((a,b)=>(b.volume_24h||0)-(a.volume_24h||0))
        .slice(0,5);
      
      if (!deals.length) {
        el.innerHTML = '<div class="panel-empty" data-i18n="no_deals">No hot deals right now</div>';
        __retranslate();
        return;
      }
      
      el.innerHTML = '<div class="poly-list">' + deals.map(m=>{
        const yesPct = ((m.yes_price||0)*100).toFixed(0);
        const vol = m.volume_24h ? '$'+(m.volume_24h/1000).toFixed(1)+'K' : '';
        const end = m.end_date ? new Date(m.end_date).toLocaleDateString('en-US',{month:'short',day:'numeric'}) : '';
        const title = (m.question||m.event_title||'').substring(0,55);
        return `<div class="poly-card">
          <div class="poly-title">${title}${(m.question||'').length>55?'…':''}</div>
          <div class="poly-meta">
            <span class="poly-odds">${yesPct}% Yes</span>
            ${vol ? `<span class="poly-volume">${vol}</span>` : ''}
            ${end ? `<span class="poly-expiry">${end}</span>` : ''}
          </div>
        </div>`;
      }).join('') + '</div>';
      __retranslate();
    })
    .catch(()=>{
      el.innerHTML = '<div class="panel-empty" data-i18n="no_deals">No hot deals right now</div>';
      __retranslate();
    });
}

function buildTopBotsPanel(bots){
  const el = document.getElementById('panel-leaders-body');
  const top = [...bots].sort((a,b)=>b.total_value-a.total_value).slice(0,5);
  const medalColors = ['#FFD700','#C0C0C0','#CD7F32'];
  el.innerHTML = '<div class="panel-leader-list">' + top.map((b,i)=>{
    const r = +b.total_return_pct||0;
    return `<div class="panel-leader-row">
      <div class="panel-leader-rank" style="color:${i<3?medalColors[i]:'var(--tv-text-2)'}">${i<3 ? ['🥇','🥈','🥉'][i] : '#'+(i+1)}</div>
      <div class="panel-leader-name"><span>${b.avatar}</span> ${b.display_name}</div>
      <div class="panel-leader-pnl ${r>=0?'profit':'loss'}">${r>=0?'+':''}${r.toFixed(2)}%</div>
    </div>`;
  }).join('') + '</div>';
}

function buildDistribution(bots){
  const riskMap = {};
  const riskColors = {'VERY LOW':'#4caf50','LOW':'#089981','MED':'#ff9800','HIGH':'#f23645','VERY HIGH':'#d32f2f'};
  bots.forEach(b=>{
    const r = b.risk_level || 'MED';
    riskMap[r] = (riskMap[r]||0)+1;
  });
  const riskLabels = Object.keys(riskMap).sort((a,b)=>['VERY LOW','LOW','MED','HIGH','VERY HIGH'].indexOf(a)-['VERY LOW','LOW','MED','HIGH','VERY HIGH'].indexOf(b));
  const riskData = riskLabels.map(k=>riskMap[k]);
  const riskCols = riskLabels.map(k=>riskColors[k]||'#787b86');

  if(riskChart) riskChart.destroy();
  riskChart = new Chart(document.getElementById('riskChart'),{
    type:'doughnut',
    data:{
      labels: riskLabels,
      datasets:[{data:riskData,backgroundColor:riskCols,borderWidth:0,spacing:4}]
    },
    options:{
      responsive:true,cutout:'68%',
      plugins:{
        legend:{
          position:'bottom',
          labels:{color:'#d1d4dc',font:{family:'Inter',size:11},padding:12,usePointStyle:true,pointStyleWidth:8}
        },
        tooltip:{
          callbacks:{
            label:function(ctx){
              var pct = ((ctx.parsed/bots.length)*100).toFixed(0);
              return ' ' + ctx.label + ': ' + ctx.parsed + ' ' + __('count_bots','bots') + ' (' + pct + '%)';
            }
          }
        }
      }
    }
  });

  const top = [...bots].sort((a,b)=>b.total_return_pct-a.total_return_pct).slice(0,5);
  document.getElementById('top-performers').innerHTML = top.map((b,i)=>{
    const r = +b.total_return_pct||0;
    const barW = Math.min(Math.abs(r)/30*100,100);
    return `<div class="tp-row">
      <div class="tp-rank">${i+1}</div>
      <div class="tp-avatar">${b.avatar}</div>
      <div class="tp-name">${b.display_name}</div>
      <div class="tp-bar-wrap"><div class="tp-bar ${r>=0?'tp-bar-up':'tp-bar-down'}" style="width:${barW}%"></div></div>
      <div class="tp-val ${r>=0?'c-green':'c-red'}">${r>=0?'+':''}${r.toFixed(2)}%</div>
    </div>`;
  }).join('');
}

function buildMainChart(bots){
  const allHist = {};
  bots.forEach(b=>{
    (b.portfolio_history||[]).forEach(h=>{
      const ts = new Date(h.timestamp).getTime();
      if(!allHist[ts]) allHist[ts] = {ts,val:0,count:0};
      allHist[ts].val += (+h.value||0);
      allHist[ts].count++;
    });
  });
  let entries = Object.values(allHist).sort((a,b)=>a.ts-b.ts);
  if(entries.length<2) { document.getElementById('chart-panel').style.display='none'; return; }

  const labels = entries.map(h=>{
    const d = new Date(h.ts);
    return (d.getMonth()+1)+'/'+d.getDate()+' '+String(d.getUTCHours()).padStart(2,'0')+':'+String(d.getUTCMinutes()).padStart(2,'0');
  });
  const vals = entries.map(h=>h.val);
  const startVal = vals[0]||200000;
  const isUp = vals[vals.length-1]>=startVal;
  const lineColor = isUp?'#089981':'#f23645';
  const fillColor = isUp?'rgba(8,153,129,0.08)':'rgba(242,54,69,0.08)';

  if(mainChart) mainChart.destroy();
  mainChart = new Chart(document.getElementById('mainChart'),{
    type:'line',
    data:{
      labels,
      datasets:[{
        data:vals,
        borderColor:lineColor,
        backgroundColor:fillColor,
        borderWidth:2,
        pointRadius:0,
        pointHoverRadius:4,
        pointHoverBackgroundColor:lineColor,
        fill:true,
        tension:0.3
      }]
    },
    options:{
      responsive:true,
      maintainAspectRatio:false,
      plugins:{
        legend:{display:false},
        tooltip:{
          backgroundColor:'#1e222d',
          titleColor:'#d1d4dc',
          bodyColor:'#d1d4dc',
          borderColor:'#2a2e39',
          borderWidth:1,
          padding:12,
          cornerRadius:6,
          callbacks:{
            label:function(ctx){
              return ' ' + __('kpi_combined_aum','Combined AUM') + ': ' + ctx.parsed.y.toLocaleString('en-US',{style:'currency',currency:'USD',minimumFractionDigits:0});
            }
          }
        }
      },
      scales:{
        x:{ticks:{color:'#787b86',maxTicksLimit:8,font:{family:'JetBrains Mono',size:10}},grid:{color:'rgba(255,255,255,0.04)'}},
        y:{ticks:{color:'#787b86',font:{family:'JetBrains Mono',size:10},callback:v=>'$'+v.toLocaleString('en-US',{maximumFractionDigits:0})},grid:{color:'rgba(255,255,255,0.04)'}}
      },
      interaction:{intersect:false,mode:'index'}
    }
  });
}

async function load(){
  const data = await fetch('./data/leaderboard.json?t='+Date.now()).then(r=>r.json());
  const bots = data.bots||[];
  const sorted = [...bots].sort((a,b)=>b.total_value-a.total_value);

  buildKPIs(sorted);
  buildDistribution(sorted);
  buildMainChart(sorted);
  buildTopBotsPanel(sorted);

  document.getElementById('count-badge').textContent = sorted.length + ' ' + __('count_bots','bots');
  
  startCountdown();
  buildMarketSentinelPanel();
  buildPolymarketPanel();

  const lb=document.getElementById('leaderboard');
  lb.innerHTML='<div class="bot-list">';
  sorted.forEach((bot,i)=>{
    const medal=MEDALS[i]||`#${i+1}`;
    const r=+bot.total_return_pct||0;
    const td=+bot.today_pnl||0;
    lb.innerHTML+=`
      <a class="bot-card" href="/trade/${bot.bot_id}/">
        <div class="bot-rank ${i<3?'gold':''}">${medal}</div>
        <div class="bot-avatar-col">${bot.avatar}</div>
        <div class="bot-info-col">
          <div class="bot-name-row">
            <span class="bot-name">${bot.display_name}</span>
            <span class="risk-badge">${bot.risk_level}</span>
          </div>
          <div class="bot-meta">${bot.total_trades||0} <span data-i18n="trades">trades</span> · ${Object.keys(bot.positions||{}).length} <span data-i18n="positions">positions</span></div>
        </div>
        <div class="bot-val-col">
          <div class="bot-val">${fmt(bot.total_value||0)}</div>
          <div class="bot-ret ${r>=0?'c-green':'c-red'}">${r>=0?'+':''}${r.toFixed(2)}%</div>
        </div>
        <div class="bot-today-col">
          <div class="bot-today-lbl" data-i18n="today">Today</div>
          <div class="bot-today-val ${td>=0?'c-green':'c-red'}">${td>=0?'+':'-'}${fmt(Math.abs(td))}</div>
        </div>
        <div class="bot-arrow">→</div>
      </a>`;
  });
  lb.innerHTML+='</div>';

  document.getElementById('footer').innerHTML =
    `<span class="footer-text" data-i18n="footer">PaperChase · Trading Arena · Data refreshes every 30 min during US market hours</span>`;

  __retranslate();

  setTimeout(load,90000);
}

// ── Kick off data load ──
load().catch(function(e){ 
  console.error('load() failed:', e.message, e.stack);
  document.getElementById('leaderboard').innerHTML='<div style="color:var(--tv-text-3);text-align:center;padding:60px 20px;font-size:14px">⚠ ' + __('error_loading','Something went wrong. Please try again.') + '</div>'; 
});
</script>
</body>
</html>
